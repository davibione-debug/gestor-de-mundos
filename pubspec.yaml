name: gestor_de_mundos
description: O universo da sua campanha, na palma da mão.
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  archive: ^3.6.1
  excel: ^4.0.6
  record: ^7.1.2
  path_provider: ^2.1.5
  file_picker: ^12.3.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3

dev_dependencies:
  analyzer: ^13.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"

flutter:
  uses-material-design: true
